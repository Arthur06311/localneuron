name: Public website
# O site público é a branch gh-pages, servida em https://localneuron.ai.
# Não publique a pasta website/ de main. Proponha mudanças com um pull request contra gh-pages.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - name: O site não sai de main
        run: |
          echo "O site vive na branch gh-pages. Abra um pull request contra essa branch."
          exit 1
