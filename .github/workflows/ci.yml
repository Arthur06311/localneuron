name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Chromium headless para a auditoria de acessibilidade
        run: npx playwright install chromium
      - name: Bibliotecas do Chromium
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm test
      - name: Testes Python
        shell: bash
        run: python -m unittest discover -s tests -p '*_test.py'
      - run: node scripts/verify.mjs
