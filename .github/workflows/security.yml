# Detecção de segredos e auditoria de dependências de produção.
# Arquivo próprio: não altera ci.yml (testes na matriz de sistemas),
# desktop-diagnosis.yml nem um futuro workflow de release.
name: Segurança

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binário oficial, fixado por versão e SHA-256. A gitleaks-action comenta
      # no pull request e consulta a API de pulls; o CLI fica em contents: read
      # e varre o histórico inteiro do clone, não só o diff do evento.
      - name: Instalar gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "${archive}" "${url}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          rm -f "${archive}" gitleaks

      - name: Detectar segredos no histórico
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não bloqueante de propósito. O log mostra a falha, mas o check fica verde.
      # Para tornar bloqueante: apague continue-on-error desta etapa.
      - name: npm audit (produção, alto ou crítico, não bloqueante)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
