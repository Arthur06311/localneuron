name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente para reconstruir (ex.: v0.27.0). Vazio usa v mais a versão do package.json do commit selecionado."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Conferir tag, versão e changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ir para a tag informada
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag inválida. Use vX.Y.Z." >&2
            exit 1
          fi
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "refs/tags/${TAG}"
      - name: Conferir tag, package.json e changelog
        id: check
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: node scripts/check-release-version.mjs --github-output

  linux:
    name: AppImage Linux
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Empacotar com Electron Packager
        run: npm run package -- linux x64
      - name: Gerar AppImage
        run: python3 scripts/package-appimage.py releases/LocalNeuron-linux-x64 --output releases/LocalNeuron-Linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: localneuron-linux
          path: releases/LocalNeuron-Linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Instalador NSIS Windows
    needs: preparar
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar NSIS
        shell: bash
        run: choco install nsis --no-progress -y
      - run: npm ci
      - name: Empacotar com Electron Packager
        run: npm run package -- win32 x64
      - name: Gerar instalador NSIS
        shell: bash
        run: python scripts/package-nsis.py releases/LocalNeuron-win32-x64 --output releases/LocalNeuron-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: localneuron-windows
          path: releases/LocalNeuron-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Rascunho da release
    needs: [preparar, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: localneuron-*
          merge-multiple: true
          path: release-assets
      - name: Conferir artefatos e gerar SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flat
          mapfile -t appimages < <(find release-assets -type f -name 'LocalNeuron-Linux-x64.AppImage' | sort)
          mapfile -t installers < <(find release-assets -type f -name 'LocalNeuron-Windows-x64-Setup.exe' | sort)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#installers[@]}" -ne 1 ]; then
            echo "Esperava um AppImage e um instalador NSIS." >&2
            exit 1
          fi
          cp "${appimages[0]}" "${installers[0]}" flat/
          python3 scripts/sha256sums.py --output flat/SHA256SUMS.txt flat/LocalNeuron-Linux-x64.AppImage flat/LocalNeuron-Windows-x64-Setup.exe
          grep -q 'LocalNeuron-Linux-x64.AppImage$' flat/SHA256SUMS.txt
          grep -q 'LocalNeuron-Windows-x64-Setup.exe$' flat/SHA256SUMS.txt
      - name: Extrair notas e gerar o feed candidato
        shell: bash
        env:
          TAG: ${{ needs.preparar.outputs.tag }}
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/check-release-version.mjs --tag "$TAG" --notes-file release-notes.md
          mkdir -p /tmp/release-sums
          cp flat/SHA256SUMS.txt flat/LocalNeuron-Linux-x64.AppImage flat/LocalNeuron-Windows-x64-Setup.exe /tmp/release-sums/
          node scripts/build-release-manifest.mjs --sums /tmp/release-sums/SHA256SUMS.txt --tag "$TAG" --version "$VERSION" --notes-file release-notes.md --output flat/releases.json
      - name: Publicar rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          set -euo pipefail
          title="LocalNeuron ${VERSION}"
          assets=(
            flat/LocalNeuron-Linux-x64.AppImage
            flat/LocalNeuron-Windows-x64-Setup.exe
            flat/SHA256SUMS.txt
            flat/releases.json
          )
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            if [ "$draft" != "true" ]; then
              echo "A release ${TAG} já foi publicada. Este workflow só atualiza rascunho." >&2
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file release-notes.md "${assets[@]}"
          fi
