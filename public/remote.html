<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalNeuron · Remoto</title><link rel="stylesheet" href="/remote.css"><script src="/remote.js" defer></script><body><header><span class="mark">C</span><div><strong>LocalNeuron</strong><small>Seu computador, sua IA.</small></div><button id="disconnect">Desconectar</button></header><main><section id="connect"><h1>Sua IA onde você estiver.</h1><p>Conecte-se ao computador que está executando o LocalNeuron, na sua rede privada ou VPN.</p><label>Chave de acesso<input id="key" type="password" autocomplete="off" placeholder="Cole sua chave Pro"></label><button id="login">Conectar</button><p id="connection-error" role="status"></p></section><section id="conversation" hidden><div id="messages" aria-live="polite"></div><form id="composer"><textarea id="prompt" required placeholder="Escreva uma mensagem…" rows="3"></textarea><button id="send">Enviar</button><button type="button" id="stop" hidden>Parar</button></form></section></main></body></html>
