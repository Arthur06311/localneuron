title = "LocalNeuron"

# Estende as regras padrão do gitleaks. Sem useDefault, este arquivo
# substituiria o conjunto de regras e o scan deixaria de detectar segredos.
[extend]
useDefault = true

# Falso positivo justificado. A regra curl-auth-header dispara no exemplo
# de desenvolvedor da tela de API local (public/sharing.js). O valor extraído
# é o placeholder literal SUA_CHAVE (8 caracteres, entropia ~2,95, logo acima
# do limiar 2,75 da regra). Não é credencial: a chave real é gerada em tempo
# de execução e não entra no repositório.
#
# condition = "AND" exige as três restrições ao mesmo tempo. Um Bearer
# diferente no mesmo arquivo, ou este placeholder em outro caminho, continua
# sendo reportado.
[[allowlists]]
description = "Placeholder SUA_CHAVE no exemplo de curl de public/sharing.js"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^SUA_CHAVE$''']
paths = ['''(^|/)public/sharing\.js$''']

# Falsos positivos do histórico. O scan usa --full-history, então apagar a
# linha no arquivo atual não limpa o commit antigo. Não há force-push.
# Os dois valores são placeholders curtos, sem credencial. O guia e o
# exemplo atuais não repetem esses textos.
[[allowlists]]
description = "Placeholder antigo do webhook em docs/billing-deploy.md"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^temporario_troque_no_passo_[0-9]+$''']
paths = ['''(^|/)docs/billing-deploy\.md$''']

[[allowlists]]
description = "Placeholder antigo do HMAC em .env.example"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^substitua_por_um_segredo_de_pelo_menos_32_caracteres$''']
paths = ['''(^|/)\.env\.example$''']
